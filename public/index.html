<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Task Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📋 Live Task Board</h1>
    <div id="status" class="status">connecting…</div>
  </header>

  <section class="presence">
    <strong>Online:</strong>
    <div id="presenceList"></div>
  </section>

  <div class="board" id="board">
    <div class="column" data-column="todo"><h2>Todo</h2><div class="cards"></div></div>
    <div class="column" data-column="doing"><h2>In Progress</h2><div class="cards"></div></div>
    <div class="column" data-column="done"><h2>Done</h2><div class="cards"></div></div>
  </div>

  <form id="addForm">
    <input id="titleInput" placeholder="New task title…" maxlength="120" required />
    <button type="submit">Add task</button>
  </form>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
